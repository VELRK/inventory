name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend into /app (only production files)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          # Server layout: plots/app/ = Vite dist only (index.html, assets, .htaccess)
          rm -rf ../app
          mkdir -p ../app
          cp -r dist/. ../app/
          test -f ../app/index.html
          test -f ../app/.htaccess
          ls -la ../app
          ls -la ../app/assets

      - name: Deploy via rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACAIXkaySUraa66PDmvqCrMQ+mbRCd+1hCFCvQKvLMnjDwAAAKhddCUjXXQl
            IwAAAAtzc2gtZWQyNTUxOQAAACAIXkaySUraa66PDmvqCrMQ+mbRCd+1hCFCvQKvLMnjDw
            AAAEDXTc+WKCQo6mq9qKvq+eOkxEvKbNVicJBSBQpX+Po+8QheRrJJStprro8Oa+oKsxD6
            ZtEJ37WEIUK9Aq8syeMPAAAAImdpdGh1Yi1hY3Rpb25zLWJlc3Rob21lcy1ob3N0aW5nZX
            IBAgM=
            -----END OPENSSH PRIVATE KEY-----
          REMOTE_HOST: 185.224.137.104
          REMOTE_USER: u221026474
          REMOTE_PORT: "65002"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no -o AddressFamily=inet -4"
          ARGS: "-rlgoDzvc"
          SOURCE: "./"
          TARGET: /home/u221026474/domains/superfinelabels.in/public_html/plots
          EXCLUDE: "/.git/, /.github/, /frontend/, /_ci_tmp/, /ci3.zip, /tests/, /docs/, /application/logs/*, /application/cache/sessions/*, /uploads/projects/, /uploads/users/, /uploads/units/, /uploads/documents/, /application/config/database.php, /README.md, /license.txt"
          SCRIPT_AFTER: |
            cd /home/u221026474/domains/superfinelabels.in/public_html/plots
            if [ -f .htaccess ]; then
              sed -i 's|RewriteBase /inventory/|RewriteBase /plots/|g' .htaccess || true
            fi
            if [ -f application/config/config.php ]; then
              sed -i "s|\$config\['base_url'\] = '.*';|\$config['base_url'] = 'https://superfinelabels.in/plots/';|g" application/config/config.php || true
            fi
            mkdir -p app uploads/projects uploads/users uploads/units uploads/documents
            mkdir -p application/logs application/cache/sessions
            touch uploads/projects/index.html uploads/users/index.html uploads/units/index.html uploads/documents/index.html
            chmod -R 775 uploads application/logs application/cache app || true
            echo "API:  https://superfinelabels.in/plots/"
            echo "APP:  https://superfinelabels.in/plots/app/"
            ls -la app | head -20
